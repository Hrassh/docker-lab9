name: CI/CD Docker

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      #  Завантажити код репозиторію
      - name: Checkout code
        uses: actions/checkout@v4

      #  Згенерувати тег образу з хеша коміту
      - name: Generate image tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Авторизуватися в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Зібрати образ і запушити його в Docker Hub
      - name: Build and push Docker image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/nodeapp
          docker build -t $IMAGE:${{ steps.vars.outputs.tag }} -t $IMAGE:latest .
          docker push $IMAGE:${{ steps.vars.outputs.tag }}
          docker push $IMAGE:latest

      # Розшифрувати SSH-ключ із секрету
      - name: Decode SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > ec2-key.pem
          chmod 600 ec2-key.pem

      #  Запустити контейнер на EC2
      - name: Deploy to EC2
        run: |
          ssh -i ec2-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
  
            if ! command -v docker > /dev/null; then
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo systemctl enable --now docker
            fi

      
            sudo npm uninstall -g pm2 2>/dev/null || true

         
            sudo docker rm -f nodeapp || true

          
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:${{ steps.vars.outputs.tag }}
            sudo docker run -d --name nodeapp -p 3000:3000 --restart always \
              ${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:${{ steps.vars.outputs.tag }}

            sudo docker ps
          EOF
